name: Database Keep-Alive Daemon

on:
  schedule:
    # Trigger probe every 6 hours to prevent inactivity cold starts
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Keep-Alive Database Probe
        run: |
          curl -f -s -i -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/health/ping"
